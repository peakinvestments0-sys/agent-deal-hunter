<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lauren's Fixer Desk</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 360px; background-color: #0f172a; color: #f8fafc; padding: 14px; font-size: 12px; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; padding-bottom: 10px; margin-bottom: 12px; }
    .title-box { display: flex; align-items: center; gap: 8px; }
    .badge { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); padding: 2px 7px; border-radius: 999px; font-size: 9px; font-weight: 700; text-transform: uppercase; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .prop-title { font-size: 13px; font-weight: 700; color: #ffffff; margin-bottom: 4px; }
    .prop-sub { font-size: 11px; color: #94a3b8; margin-bottom: 10px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .stat-box { background: #0f172a; padding: 6px 8px; border-radius: 8px; border: 1px solid #334155; }
    .stat-label { font-size: 9px; color: #64748b; text-transform: uppercase; font-weight: 600; }
    .stat-val { font-size: 12px; font-weight: 700; color: #f8fafc; font-family: monospace; }
    .val-amber { color: #fbbf24; }
    .val-emerald { color: #34d399; }
    .input-group { margin-top: 8px; }
    .input-label { font-size: 10px; color: #94a3b8; margin-bottom: 3px; display: block; font-weight: 600; }
    .input-field { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 6px 8px; font-size: 11px; color: #ffffff; outline: none; }
    .input-field:focus { border-color: #f59e0b; }
    .btn-push { width: 100%; background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; border: none; border-radius: 10px; padding: 10px; font-weight: 800; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25); transition: opacity 0.2s; }
    .btn-push:hover { opacity: 0.95; }
    .btn-push:disabled { opacity: 0.5; cursor: not-allowed; }
    .alert { padding: 8px; border-radius: 8px; font-size: 11px; margin-top: 10px; display: none; text-align: center; font-weight: 600; }
    .alert-success { background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; }
    .alert-error { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #f87171; }
    .footer-link { text-align: center; margin-top: 10px; }
    .footer-link a { color: #94a3b8; text-decoration: none; font-size: 10px; }
    .footer-link a:hover { color: #f59e0b; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-box">
      <span style="font-size: 16px;">🔨</span>
      <strong style="color: #ffffff; font-size: 13px;">Lauren's Fixer Desk</strong>
    </div>
    <span class="badge">Trojan Horse</span>
  </div>

  <div id="loadingBox" style="text-align: center; padding: 20px 0; color: #94a3b8;">
    <span>⏳ Scanning Redfin property...</span>
  </div>

  <div id="contentBox" style="display: none;">
    <div class="card">
      <div class="prop-title" id="dispAddress">123 Sample St</div>
      <div class="prop-sub" id="dispCity">Melbourne, FL &bull; <span id="dispDom">1 DOM</span></div>

      <div class="grid">
        <div class="stat-box">
          <div class="stat-label">List Price</div>
          <div class="stat-val val-amber" id="dispPrice">$0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Redfin Est</div>
          <div class="stat-val val-emerald" id="dispEstimate">$0</div>
        </div>
      </div>

      <div class="grid">
        <div class="stat-box">
          <div class="stat-label">SqFt</div>
          <div class="stat-val" id="dispSqft">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Baseline MAO</div>
          <div class="stat-val val-amber" id="dispMao">$0</div>
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">Listing Agent Name</label>
        <input type="text" id="inputAgentName" class="input-field" placeholder="Agent Name">
      </div>

      <div class="input-group">
        <label class="input-label">Agent Cell Phone (For SMS)</label>
        <input type="tel" id="inputAgentPhone" class="input-field" placeholder="(407) 555-0199">
      </div>

      <div class="input-group">
        <label class="input-label">Agent Email (For Standing LOI)</label>
        <input type="email" id="inputAgentEmail" class="input-field" placeholder="agent@brokerage.com">
      </div>
    </div>

    <button id="btnPush" class="btn-push">
      <span>🚀 Push to Lauren's Desk</span>
    </button>
  </div>

  <div id="alertBox" class="alert"></div>

  <div class="footer-link">
    <a href="http://localhost:8001" target="_blank">Open Deal Hunter Dashboard &rarr;</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
